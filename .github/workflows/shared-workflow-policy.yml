name: Shared workflow policy
on:
  pull_request:
  push:
    branches: [main, refactor/architecture-campaign]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    uses: codeandsolder/ci-workflows/.github/workflows/workflow-concurrency.yml@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
