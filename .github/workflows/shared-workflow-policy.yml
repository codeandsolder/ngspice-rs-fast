name: Shared workflow policy
on:
  pull_request:
  push:
    branches: [main, refactor/architecture-campaign]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    uses: codeandsolder/ci-workflows/.github/workflows/workflow-concurrency.yml@9c14ef2d72423958c56944febc620ec50f01d65a # main
