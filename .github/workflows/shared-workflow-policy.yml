name: Shared workflow policy
on:
  pull_request:
  push:
    branches: [main, refactor/architecture-campaign]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    uses: codeandsolder/ci-workflows/.github/workflows/workflow-concurrency.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
