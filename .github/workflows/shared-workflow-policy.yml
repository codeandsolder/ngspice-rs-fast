name: Shared workflow policy
on:
  pull_request:
  push:
    branches: [main, refactor/architecture-campaign]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    uses: codeandsolder/ci-workflows/.github/workflows/workflow-concurrency.yml@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
