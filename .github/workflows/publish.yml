name: Publish

# Publishes the `ngspice-rs` crate to crates.io. See docs/port/RELEASING.md.
#
# - Pushing a tag `vX.Y.Z` runs the release gate and then publishes. The tag
#   must match `version` in Cargo.toml.
# - Running it by hand (workflow_dispatch) does a dry run unless `dry-run` is
#   unchecked, in which case it publishes the version in Cargo.toml from the
#   chosen ref.
#
# Authentication uses crates.io Trusted Publishing (OIDC), so no long-lived API
# token is stored in the repository. The publish job runs in the `crates-io`
# environment, which is where required reviewers can be added.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package and verify only; do not upload to crates.io
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  strict-rust:
    name: Shared strict Rust release gate
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@707c9e77430c7feed80a39959b273501ca786825 # main
    with:
      allow-test-panics: true

  verify:
    needs: strict-rust
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release dependency quarantine
        uses: codeandsolder/ci-workflows/.github/actions/cargo-release-quarantine@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
        with:
          base-ref: refs/remotes/origin/${{ github.event.repository.default_branch }}
          hours: "72"
          lockfile: auto

      - name: Resolve quarantined repository compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: clippy, rustfmt

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Read and validate crate version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(bash .github/scripts/release-version.sh "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release archive contracts
        shell: bash
        run: bash .github/scripts/test-release-package.sh

      - name: Run workspace tests and doctests
        run: cargo test --workspace --locked

      - name: Verify Rust output against committed goldens
        run: cargo xtask golden verify

      - name: Package and verify crate
        run: cargo publish --dry-run --locked --package ngspice-rs

      - name: List packaged files
        run: cargo package --list --locked --package ngspice-rs

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main

  publish:
    name: Publish to crates.io
    needs: [strict-rust, verify]
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/ngspice-rs/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve quarantined repository compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Publish ngspice-rs
        run: cargo publish --locked --package ngspice-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@97a50dd3304be8cf19738aa1c027ac4ecd1f3d2b # main
