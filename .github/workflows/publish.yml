name: Publish

# Publishes the `ngspice-rs` crate to crates.io. See docs/port/RELEASING.md.
#
# - Pushing a tag `vX.Y.Z` runs the release gate and then publishes. The tag
#   must match `version` in Cargo.toml.
# - Running it by hand (workflow_dispatch) does a dry run unless `dry-run` is
#   unchecked, in which case it publishes the version in Cargo.toml from the
#   chosen ref.
#
# Authentication uses crates.io Trusted Publishing (OIDC), so no long-lived API
# token is stored in the repository. The publish job runs in the `crates-io`
# environment, which is where required reviewers can be added.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package and verify only; do not upload to crates.io
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  strict-rust:
    name: Strict Rust and workflow policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@073d436b3d759343900bdc5e4ddecfa120792b8c # pinned
    with:
      rust-toolchain: nightly-2026-11-20
      allow-test-panics: true

  verify:
    needs: strict-rust
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-11-20
          components: clippy, rustfmt

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@d168449633a47de6c0166f0c0cff903e96983820 # main
        with:
          rust-toolchain: nightly-2026-11-20

      - name: Read crate version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "ngspice-rs") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"

      - name: Check tag matches Cargo.toml
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Run workspace tests and doctests
        run: cargo test --workspace --locked

      - name: Verify Rust output against committed goldens
        run: cargo xtask golden verify

      - name: Package and verify crate
        run: cargo publish --dry-run --locked --package ngspice-rs

      - name: List packaged files
        run: cargo package --list --locked --package ngspice-rs

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@d168449633a47de6c0166f0c0cff903e96983820 # main

  publish:
    name: Publish to crates.io
    needs: verify
    if: github.ref_type == 'tag' || inputs.dry-run == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/ngspice-rs/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-11-20

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@d168449633a47de6c0166f0c0cff903e96983820 # main
        with:
          rust-toolchain: nightly-2026-11-20

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish ngspice-rs
        run: cargo publish --locked --package ngspice-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@d168449633a47de6c0166f0c0cff903e96983820 # main
