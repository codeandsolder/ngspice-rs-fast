name: Release binaries

# Builds the `spice-rs` binary for each supported target and attaches the
# archives to the GitHub release for the tag, so `cargo binstall ngspice-rs`
# can download a prebuilt binary instead of compiling. See
# docs/port/RELEASING.md.
#
# Archive names and layout must match `[package.metadata.binstall]` in
# Cargo.toml:
#   ngspice-rs-<target>-v<version>.tar.gz   (.zip on Windows)
#   └── ngspice-rs-<target>-v<version>/spice-rs[.exe], README.md, licence files
#
# A tag push builds that tag. Manual runs default to build-only validation;
# explicitly select an existing tag and disable dry-run to replace its assets.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (empty validates the selected ref)
        required: false
        type: string
      dry-run:
        description: Build and package without attaching release assets
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  qualify:
    name: Check release input and dependency quarantine
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Require a tag for manual asset replacement
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == false
        shell: bash
        run: |
          if [[ -z "$TAG" ]]; then
            echo "An existing release tag is required to attach assets" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && env.TAG != '' && format('refs/tags/{0}', env.TAG) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: codeandsolder/ci-workflows/.github/actions/cargo-release-quarantine@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
        with:
          base-ref: refs/remotes/origin/${{ github.event.repository.default_branch }}
          hours: "72"
          lockfile: auto
      - name: Record qualified source revision
        id: source
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: qualify
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out selected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.qualify.outputs.revision }}
          persist-credentials: false

      - name: Resolve quarantined repository compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check tag matches Cargo.toml
        id: version
        shell: bash
        run: |
          version=$(bash .github/scripts/release-version.sh "$TAG")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build spice-rs
        run: cargo build --release --locked --package ngspice-rs --bin spice-rs --target ${{ matrix.target }}

      - name: Smoke-test the native binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=""
          if [[ "$TARGET" == *windows* ]]; then ext=".exe"; fi
          "target/$TARGET/release/spice-rs$ext" devices

      - name: Package archive
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          archive=$(bash .github/scripts/package-release.sh "$TARGET" "$PACKAGE_TAG" target dist)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main

  release:
    name: Attach to GitHub release
    needs: [qualify, build]
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Confirm release tag still names the qualified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Reject moved release tag
        shell: bash
        env:
          QUALIFIED_REVISION: ${{ needs.qualify.outputs.revision }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$QUALIFIED_REVISION" ]]; then
            echo "Release tag moved after qualification" >&2
            exit 1
          fi
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum ngspice-rs-* > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "ngspice-rs ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
