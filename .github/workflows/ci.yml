name: Rust CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Nightly Rust build, tests, docs and goldens
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@c91a4c750313d013131dd9b5cda15d1523cf81b6 # main
    with:
      command: |
        cargo test --workspace --locked --no-fail-fast
        cargo xtask golden verify
        cargo doc --workspace --no-deps --locked
        cargo build --workspace --locked --release

  strict-rust:
    name: Strict Rust and workflow policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@535609a4878f34a6697afea7ba3da04a454cc5f4 # main
    with:
      allow-test-panics: true

  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@c91a4c750313d013131dd9b5cda15d1523cf81b6 # main

  clone-regression:
    uses: codeandsolder/ci-workflows/.github/workflows/clone-regression.yml@c91a4c750313d013131dd9b5cda15d1523cf81b6 # main

  # The shared strict gate already enforces the quarantine on pull requests.
  # Also enforce it for direct campaign-branch pushes and merge queues.
  cargo-release-age:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref_type == 'branch' &&
      github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","local-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: codeandsolder/ci-workflows/.github/actions/cargo-release-quarantine@c91a4c750313d013131dd9b5cda15d1523cf81b6 # main
        with:
          base-ref: ${{ github.event.merge_group.base_sha || github.event.before }}
          hours: "72"
          lockfile: auto
