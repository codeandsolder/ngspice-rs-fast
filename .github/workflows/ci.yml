name: Rust CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Nightly Rust build, tests, docs and goldens
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@9c14ef2d72423958c56944febc620ec50f01d65a # main
    with:
      command: |
        cargo test --workspace --locked
        cargo xtask golden verify
        cargo doc --workspace --no-deps --locked
        cargo build --workspace --locked --release

  strict-rust:
    name: Strict Rust and workflow policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@cb9083676196a8ec3bf013e7253907b2759020c7 # main
    with:
      allow-test-panics: true
