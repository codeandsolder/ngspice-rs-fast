name: Rust CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Nightly Rust build, tests, docs and goldens
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@d168449633a47de6c0166f0c0cff903e96983820 # main
    with:
      rust-toolchain: "nightly-2026-11-20"
      command: |
        cargo test --workspace --locked
        cargo xtask golden verify
        cargo doc --workspace --no-deps --locked
        cargo build --workspace --locked --release

  strict-rust:
    name: Strict Rust and workflow policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@073d436b3d759343900bdc5e4ddecfa120792b8c # main
    with:
      allow-test-panics: true
      rust-toolchain: nightly-2026-11-20
