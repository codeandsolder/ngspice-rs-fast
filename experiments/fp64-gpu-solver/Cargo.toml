[package]
name = "ngspice-fp64-gpu-batches-experiment"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]
resolver = "3"

[dependencies]
wgpu = { version = "29.0.4", default-features = false, features = ["std", "parking_lot", "vulkan", "spirv"] }
bytemuck = "1.25"
pollster = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
